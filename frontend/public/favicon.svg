<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ticket body -->
  <rect x="4" y="12" width="56" height="40" rx="8" fill="#1c1d22"/>
  <!-- Perforation notch (the "torn stub" edge, echoing the ticket design system) -->
  <circle cx="22" cy="12" r="5" fill="#f8f7f3"/>
  <circle cx="22" cy="52" r="5" fill="#f8f7f3"/>
  <line x1="22" y1="20" x2="22" y2="44" stroke="#f8f7f3" stroke-width="2" stroke-dasharray="3 4"/>
  <!-- Locked slot mark: a clock/lock hybrid signifying "time, locked in" -->
  <circle cx="42" cy="32" r="11" fill="none" stroke="#a8823c" stroke-width="3"/>
  <path d="M42 25v7l5 4" fill="none" stroke="#a8823c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>